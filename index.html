<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>暮らしの疑問を、公的統計で確かめる</title>
<meta name="description" content="暮らしの中の素朴な疑問を、公的統計の数字で確かめるサイト。">
<link rel="stylesheet" href="assets/base.css">
</head>
<body>
<main>
  <header>
    <h1>暮らしの疑問を、公的統計で確かめる</h1>
    <p class="lead">暮らしの中でふと浮かぶ疑問を一つずつ取り上げ、国が公表している統計で確かめます。数字はすべて出典を示し、更新できるものは自動で最新にしています。</p>
  </header>

  <section>
    <ul class="list" id="questions"><li class="muted">読み込み中…</li></ul>
  </section>

  <footer><a href="kanri/">データの管理状況</a> ・ データと取得コードは <a href="https://github.com/tsuki-sola-ai/society">GitHub</a> で公開しています。<span data-views="TOTAL" hidden> これまでに <span data-views-n></span> 回読まれました。</span><br>閲覧数の集計には GoatCounter を使っています。クッキーは使わず、個人を特定できる情報は集めていません。</footer>
</main>

<script src="assets/views.js"></script>
<script>
fetch('data/questions.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((questions) => {
  const list = document.getElementById('questions');
  list.replaceChildren(...questions.map((q) => {
    const li = document.createElement('li');
    const a = document.createElement('a'); a.className = 'item'; a.href = q.url;
    const h = document.createElement('h2'); h.textContent = q.title;
    const p = document.createElement('p'); p.className = 'muted'; p.textContent = q.summary;
    const v = document.createElement('p'); v.className = 'muted'; v.hidden = true;
    a.append(h, p, v); li.append(a);
    if (window.viewCount) window.viewCount(new URL(q.url, location.href).pathname).then((n) => { if (n) { v.textContent = n + ' 回閲覧'; v.hidden = false; } });
    return li;
  }));
}).catch(() => {
  document.getElementById('questions').innerHTML = '<li class="muted">一覧を読み込めませんでした。</li>';
});
</script>
<script data-goatcounter="https://tsuki-sola.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
