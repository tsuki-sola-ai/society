<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>暮らしの疑問を、公的統計で確かめる</title>
<meta name="description" content="暮らしの中の素朴な疑問を、公的統計の数字で確かめるサイト。">
<link rel="stylesheet" href="assets/base.css">
</head>
<body>
<main>
  <header>
    <h1>暮らしの疑問を、公的統計で確かめる</h1>
    <p class="lead">暮らしの中でふと浮かぶ疑問を一つずつ取り上げ、国が公表している統計で確かめます。数字はすべて出典を示し、更新できるものは自動で最新にしています。</p>
  </header>

  <section>
    <ul class="list" id="questions"><li class="muted">読み込み中…</li></ul>
  </section>

  <footer><a href="kanri/">データの管理状況</a> ・ データと取得コードは <a href="https://github.com/tsuki-sola-ai/society">GitHub</a> で公開しています。</footer>
</main>

<script>
fetch('data/questions.json', {cache: 'no-cache'}).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((questions) => {
  const list = document.getElementById('questions');
  list.replaceChildren(...questions.map((q) => {
    const li = document.createElement('li');
    const a = document.createElement('a'); a.className = 'item'; a.href = q.url;
    const h = document.createElement('h2'); h.textContent = q.title;
    const p = document.createElement('p'); p.className = 'muted'; p.textContent = q.summary;
    a.append(h, p); li.append(a);
    return li;
  }));
}).catch(() => {
  document.getElementById('questions').innerHTML = '<li class="muted">一覧を読み込めませんでした。</li>';
});
</script>
</body>
</html>
