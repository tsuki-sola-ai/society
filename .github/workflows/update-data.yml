name: データ更新

on:
  schedule:
    - cron: "17 3 8 * *" # 毎月8日 12:17 JST
  workflow_dispatch:
    inputs:
      backfill:
        description: "過去何か月分を遡って蓄積するか(0なら最新月のみ)"
        default: "0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pdfplumber
      - name: 解析部分の自己テスト
        run: python scripts/fetch_hihogosya.py --selftest
      - name: 過去分を遡って蓄積
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill != '0' }}
        run: python scripts/fetch_hihogosya.py --backfill "${{ inputs.backfill }}"
      - name: 被保護者調査を取得
        run: python scripts/fetch_hihogosya.py
      - name: 検算
        run: python scripts/validate.py
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- data; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "データ更新: 被保護者調査 $(date -u +%Y-%m-%d)"
          git push
